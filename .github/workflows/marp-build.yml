name: Marp Build Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.2'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Check for markdown files
        run: |
          if [ -z "$(find slides -name '*.md')" ]; then
            echo "Error: No markdown files found in slides directory"
            exit 1
          fi
          echo "Found markdown files:"
          find slides -name '*.md'

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: bun install

      - name: Lint markdown files
        run: bun run lint

      - name: Build slides to HTML
        run: bun run build:html

      - name: Build slides to PDF
        run: bun run build:pdf

      - name: Build slides to PPTX
        run: bun run build:pptx

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marp-slides
          path: dist/
          retention-days: 30

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Successfully built the following slides:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### HTML" >> $GITHUB_STEP_SUMMARY
          for file in dist/*.html; do
            echo "- $(basename $file)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PDF" >> $GITHUB_STEP_SUMMARY
          for file in dist/*.pdf; do
            echo "- $(basename $file)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PPTX" >> $GITHUB_STEP_SUMMARY
          for file in dist/*.pptx; do
            echo "- $(basename $file)" >> $GITHUB_STEP_SUMMARY
          done
